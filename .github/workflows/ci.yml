name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  flow:
    name: Flow Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Flow
        run: npx flow-bin check --max-workers=2 || npx flow-bin status

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    needs: [flow, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep (local rules)
        uses: returntocorp/semgrep-action@v1
        with:
          config: |
            rules/no-eval.yaml
            rules/no-eval-py.yaml
          generateSarif: true
        env:
          SEMGREP_ENABLE_VERSION_CHECK: '0'

      - name: Upload Semgrep SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif


