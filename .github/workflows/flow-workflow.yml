name: Flow Static Type Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  flow_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Flow Type Checker
        run: npx -y flow-bin@0.226.2 flow check --max-warnings=0

      - name: Report Success
        if: success()
        run: echo "Flow type check completed successfully."
